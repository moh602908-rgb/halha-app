<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دلّني AI — حلول ذكية للحياة اليومية</title>
<meta name="description" content="دلّني AI: أدلة عملية خطوة بخطوة لحل أكثر مشاكل الحياة اليومية شيوعًا، بالعربية، مع مساعد ذكاء اصطناعي يجيب عند الحاجة." />
<meta name="theme-color" content="#0F5257" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="دلّني AI" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <button class="back-btn" id="backBtn" aria-label="رجوع" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="logo-block">
      <h1 class="logo">دلّني <span class="logo-ai">AI</span></h1>
      <p class="logo-sub">مرجع عربي منظم، ومساعد ذكي عند الحاجة</p>
    </div>
  </div>
</header>

<main id="app"></main>

<footer class="app-footer">دلّني AI • الإصدار v2.2.0 • <a href="#" id="aboutLink" class="app-footer__link">عن دلّني</a></footer>

<button class="fab" id="assistantFab">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 5.94 2 10.8c0 2.77 1.47 5.23 3.78 6.85-.12.9-.5 2.5-1.53 3.9 0 0 2.55-.28 4.6-1.87 1 .27 2.06.42 3.15.42 5.52 0 10-3.94 10-8.8S17.52 2 12 2Z" fill="currentColor"/></svg>
  <span>اسأل المساعد</span>
</button>

<div class="sheet-overlay" id="sheetOverlay"></div>
<section class="sheet" id="assistantSheet" aria-hidden="true">
  <div class="sheet__handle"></div>
  <div class="sheet__header">
    <button class="back-btn" id="assistantBackBtn" aria-label="رجوع" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h2 class="sheet__title">مساعد دلّني</h2>
    <div class="sheet__header-actions">
      <span class="sheet__badge" id="aiQuotaBadge">🤖 …</span>
      <button class="sheet__reset" id="aiClearBtn" type="button" title="محادثة جديدة" aria-label="محادثة جديدة">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 4V9H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 15A8 8 0 1 0 6 7L4 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="assistant-feed" id="assistantFeed"></div>

  <div class="assistant-inputbar">
    <textarea id="assistantInput" placeholder="اكتب مشكلتك... مثال: تسرب ماء" rows="1"></textarea>
    <button type="button" class="assistant-inputbar__send" id="assistantSendBtn" aria-label="إرسال">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</section>

<script src="app.js"></script>
<script>
/* تسجيل الـ Service Worker + إجبار المتصفح على اكتشاف التحديثات فورًا.

   updateViaCache: "none" يمنع المتصفح من الاعتماد على أي نسخة مخزنة من
   sw.js نفسه عند فحص وجود تحديث؛ فحص التحديث دائمًا يذهب فعليًا للخادم.

   عند اكتشاف نسخة جديدة أصبحت هي المتحكمة (controllerchange)، نعيد تحميل
   الصفحة تلقائيًا مرة واحدة فقط، حتى تظهر أحدث نسخة للمستخدم فورًا دون
   الحاجة لتحديث يدوي أو مسح بيانات الموقع.

   ⚠️ إصلاح مهم: حدث controllerchange يُطلَق أيضًا عند أول زيارة على
   الإطلاق (انتقال من "لا يوجد Service Worker متحكم" إلى "أصبح هناك")،
   وليس فقط عند تحديث نسخة قديمة فعليًا. بدون تمييز الحالتين، قد تُعاد
   تحميل الصفحة تلقائيًا أثناء أول تفاعل حقيقي للمستخدم إن كان سريعًا
   بما يكفي (مثل فتح نافذة المساعد خلال الثانية الأولى)، مقاطعًا تفاعله
   دون داعٍ. الحل: نتذكر هل كان هناك متحكم فعلي *قبل* هذه الزيارة، ولا
   نُعيد التحميل إلا في تلك الحالة تحديدًا (تحديث نسخة سابقة حقيقي). */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const hadControllerBeforeThisLoad = !!navigator.serviceWorker.controller;

    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then((reg) => {
      // اطلب فحص تحديث فوري عند كل تحميل للصفحة، بدل انتظار الفحص الدوري للمتصفح.
      reg.update().catch(() => {});
    }).catch(() => {});

    let hasReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadControllerBeforeThisLoad) return; // أول زيارة على الإطلاق — لا داعي لإعادة تحميل
      if (hasReloaded) return; // منع حلقة تحديث متكررة
      hasReloaded = true;
      window.location.reload();
    });
  });
}
</script>
</body>
</html>
