<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12377D" />
<link rel="manifest" href="manifest.json" />
<title>منظومة الوقت — دلّني AI</title>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #f4f5f8; --card: #ffffff; --ink: #14213d; --ink-soft: #5b6478; --border: #e3e6ee; --accent: #12377D; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101522; --card: #171d2c; --ink: #eef1f8; --ink-soft: #9aa3b8; --border: #232a3d; } }
  :root[data-theme="dark"] { --bg: #101522; --card: #171d2c; --ink: #eef1f8; --ink-soft: #9aa3b8; --border: #232a3d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", Tahoma, sans-serif; direction: rtl; }
  #time-root { max-width: 520px; margin: 0 auto; padding: 20px 16px 48px; }
  .page-title { font-size: 20px; margin: 8px 0 18px; }
  .back-link { color: var(--accent); text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 4px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .section-title { font-size: 15px; margin: 0 0 10px; color: var(--ink); }
  .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .item-row:last-of-type { border-bottom: none; }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .input { padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; background: var(--card); color: var(--ink); flex: 1; min-width: 0; }
  .form-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .btn { padding: 8px 14px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .btn--ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .actions { display: flex; gap: 6px; }
</style>
</head>
<body>
  <div id="time-root"></div>
  <script type="module" src="./time-ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
