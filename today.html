<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12377D" />
<link rel="manifest" href="manifest.json" />
<title>اليوم — دلّني AI</title>
<style>
  /*
    متغيرات الألوان والخطوط والزوايا هنا تُطابق style.css الحالي في
    المستودع (--bg #F6F8FC، --primary #12377D، --accent #6C4CE0،
    --urgent #B2543A، إلخ) للحفاظ على الهوية البصرية، لكنها مُعرَّفة
    محليًا هنا ولا تستورد style.css — Today UI مستقل تمامًا (قرار
    العزل المعتمد لـOrganizer Core)، وأي تغيير مستقبلي على العلامة في
    style.css لن ينعكس هنا تلقائيًا إلا بتحديث يدوي.

    ملاحظة مهمة: التطبيق الرئيسي يحمّل خطي Tajawal وAref Ruqaa عبر
    Google Fonts (شبكة). هذه الصفحة، حفاظًا على "صفر Network" المعتمد
    لـOrganizer Core بالكامل (بما فيه واجهته)، لا تحمّل أي خط خارجي —
    تستخدم فقط خطوط النظام المحلية. هذا يعني اختلافًا بصريًا طفيفًا عن
    نمط التطبيق الرئيسي (Tajawal تحديدًا)، وهو قرار يحتاج تأكيدك إن كان
    غير مقبول (راجع التقرير).
  */
  :root {
    --bg: #F6F8FC;
    --paper: #FFFFFF;
    --ink: #171B26;
    --ink-soft: #5C6272;
    --primary: #12377D;
    --primary-tint: #E7EEFC;
    --accent: #6C4CE0;
    --accent-tint: #EDE8FC;
    --urgent: #B2543A;
    --urgent-tint: #F5E6DE;
    --border: #E3E8F2;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 6px 20px rgba(23, 27, 38, 0.07);
    --font-body: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
  }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { padding: 0 0 48px; max-width: 600px; margin: 0 auto; direction: rtl; }
  #today-root { padding: 0 14px; }

  .today-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  .today-header__date {
    font-size: 19px; font-weight: 700; margin: 0; color: var(--primary);
  }

  .btn {
    border: none; border-radius: var(--radius-sm);
    padding: 8px 14px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .btn--complete { background: var(--primary); color: #fff; }
  .btn--ghost { background: var(--paper); color: var(--ink-soft); border: 1px solid var(--border); }
  .btn--danger { background: var(--paper); color: var(--urgent); border: 1px solid var(--urgent); }
  .btn--fab {
    background: var(--accent); color: #fff;
    border-radius: 999px; padding: 10px 18px; font-size: 14px; box-shadow: var(--shadow);
  }

  .delete-control { position: relative; }
  .delete-control__panel {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 8px; padding: 8px; background: var(--urgent-tint);
    border-radius: var(--radius-sm); border: 1px solid var(--urgent);
    width: 100%;
  }
  .delete-control__panel.hidden { display: none; }
  .delete-control__q { font-size: 12.5px; color: var(--ink); width: 100%; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(23, 27, 38, 0.45);
    display: flex; align-items: flex-end; justify-content: center; z-index: 50;
  }
  .modal-card {
    background: var(--paper); width: 100%; max-width: 640px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 20px 18px 26px; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 -8px 30px rgba(23, 27, 38, 0.18);
  }
  .modal-card__title { margin: 0 0 14px; font-size: 17px; color: var(--primary); }
  .modal-card__actions { display: flex; gap: 8px; margin-top: 16px; }
  .form-label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-soft); margin-bottom: 12px; }
  .form-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .form-row .form-label { flex: 1; min-width: 120px; }
  .field-error { color: var(--urgent); font-size: 13px; margin: 0 0 10px; }
  .field-error.hidden { display: none; }
  .type-hint { font-size: 12.5px; color: var(--ink-soft); margin: -6px 0 12px; }
  .radio-row { display: flex; gap: 14px; margin-bottom: 12px; font-size: 13.5px; }
  .radio-row.hidden { display: none; }
  .weekday-checks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .weekday-checks.hidden { display: none; }
  .weekday-check { display: flex; align-items: center; gap: 4px; font-size: 12.5px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; }

  .section { margin-bottom: 22px; }
  .section__title {
    font-size: 15px; font-weight: 700; margin: 0 0 10px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px;
  }
  .section--missed .section__title { color: var(--urgent); }
  .section--completed .section__title { cursor: pointer; user-select: none; }
  .section--completed .section__title::after { content: "▾"; margin-inline-start: auto; }
  .section--completed.collapsed .section__title::after { content: "▸"; }
  .section--completed.collapsed .item-list { display: none; }

  .item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item-list__divider {
    font-size: 12px; color: var(--ink-soft); margin: 4px 2px 2px; padding-top: 6px;
    border-top: 1px dashed var(--border);
  }

  .item {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--paper); border-radius: var(--radius-md);
    padding: 12px 14px; box-shadow: var(--shadow); border: 1px solid transparent;
  }
  .item--missed { border-inline-start: 4px solid var(--urgent); background: var(--urgent-tint); }
  .item--completed { opacity: 0.72; }
  .item__icon { color: var(--accent); flex-shrink: 0; margin-top: 2px; }
  .item--missed .item__icon { color: var(--urgent); }
  .item__body { flex: 1; min-width: 0; }
  .item__title { font-size: 14.5px; font-weight: 600; word-break: break-word; }
  .item__time { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .item__meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .item__chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--border); color: var(--ink-soft); }
  .item__chip--high { color: var(--urgent); border-color: var(--urgent); }
  .item__note { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .item__actions { display: flex; flex-wrap: wrap; gap: 6px; margin-inline-start: auto; justify-content: flex-end; }

  .custom-postpone { position: relative; }
  .custom-postpone__form {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 8px; padding: 8px; background: var(--bg);
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    width: 100%;
  }
  .custom-postpone__form.hidden { display: none; }
  .input {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 8px; font-size: 13px; font-family: inherit;
  }

  .empty-state {
    text-align: center; padding: 60px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  .empty-state__msg { color: var(--ink-soft); font-size: 15px; margin: 0; }

  #today-toast {
    position: fixed; inset-inline: 0; bottom: 18px; margin: 0 auto;
    max-width: 320px; text-align: center; background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  #today-toast.visible { opacity: 0.95; }
</style>
</head>
<body>
  <div id="app-header" data-page="today"></div>
  <div id="today-root">
    <p style="text-align:center; color:var(--ink-soft); padding:40px 0;">...جارٍ التحميل</p>
  </div>
  <div id="today-toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app-header.js"></script>
  <script type="module" src="./today-ui.js"></script>
  <script>
    // تسجيل نفس Service Worker (sw.js) حتى تعمل "التحميل الأول ← التخزين ← Offline" حتى لو فُتحت هذه الصفحة أولًا.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
